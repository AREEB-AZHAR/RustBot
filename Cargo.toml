[package]
name = "chatbot"
version = "1.0.0"
edition = "2021"
description = "A local, self-learning chatbot with a visual knowledge forge"

[dependencies]
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
